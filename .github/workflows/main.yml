name: SSH Deploy
on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main
jobs:
  ssh-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: deploy to copiwin
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: copiwin.com
          username: root
          key: ${{ secrets.KEY }}
          port: 22
          command_timeout: 30m
          script: |
            cd /data/winning-product-api/
            git checkout main
            git pull
            source venv/bin/activate
            python manage.py migrate
            systemctl restart copiwinapi
